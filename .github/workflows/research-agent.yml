name: AI Research and Fact Check Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: pip install -q google-genai

      - name: Research topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import glob
          from datetime import datetime, timezone
          from google import genai

          # Find the newest topic file
          files = sorted(glob.glob("data/topics-*.json"))

          if not files:
              raise Exception("No topic file found.")

          latest_file = files[-1]

          print("Using topic file:", latest_file)

          with open(latest_file, "r", encoding="utf-8") as f:
              topics = json.load(f)

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise Exception("GEMINI_API_KEY is missing.")

          client = genai.Client(api_key=api_key)

          prompt = f"""
          You are a scientific research and fact-checking agent.

          Research the following AI-generated Instagram topic ideas.

          Use Google Search grounding.

          For every topic:

          1. Verify the main factual claim.
          2. Find reliable evidence.
          3. Prefer NASA, NOAA, ESA, universities,
             scientific institutions and reputable publications.
          4. Correct exaggerated or misleading claims.
          5. Do not invent facts.
          6. Do not invent sources.
          7. Clearly distinguish established facts from speculation.
          8. Give 2 to 4 useful sources when possible.
          9. Give a confidence score from 0 to 100.
          10. Decide whether the topic is safe and factually
              strong enough to publish.

          Return ONLY valid JSON.

          Required structure:

          {{
            "research": [
              {{
                "topic": "string",
                "verified_topic": "string",
                "key_facts": [
                  "string",
                  "string",
                  "string"
                ],
                "source_urls": [
                  "string"
                ],
                "source_titles": [
                  "string"
                ],
                "fact_confidence": 0,
                "corrected_hook": "string",
                "publishable": true,
                "notes": "string"
              }}
            ]
          }}

          TOPICS:

          {json.dumps(topics, ensure_ascii=False)}
          """

          print("Sending research request to Gemini...")

          response = client.models.generate_content(
              model="gemini-2.5-flash-lite",
              contents=prompt,
              config={
                  "tools": [
                      {"google_search": {}}
                  ],
                  "response_mime_type": "application/json"
              }
          )

          result = response.text.strip()

          print("Gemini response received.")

          try:
              research = json.loads(result)
          except json.JSONDecodeError:
              print("Invalid JSON returned by Gemini:")
              print(result)
              raise

          if "research" not in research:
              raise Exception("Missing research field.")

          now = datetime.now(timezone.utc)
          today = now.strftime("%Y-%m-%d")

          research["generated_at"] = now.isoformat()
          research["source_topic_file"] = latest_file

          output_file = f"data/research-{today}.json"

          with open(output_file, "w", encoding="utf-8") as f:
              json.dump(
                  research,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Research saved to:", output_file)
          print(
              "Number of researched topics:",
              len(research["research"])
          )

          PY

      - name: Commit research results
        run: |
          git config user.name "instagram-cloud-ai"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "AI: research and fact-check topics"
            git push
          fi
