name: AI Research and Fact Check Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: pip install -q google-genai

      - name: Research and fact-check topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import glob
          from datetime import datetime, timezone
          from google import genai

          # Find newest topic file
          topic_files = sorted(glob.glob("data/topics-*.json"))

          if not topic_files:
              raise Exception("No topic files found.")

          latest_topic_file = topic_files[-1]

          print("Using:", latest_topic_file)

          with open(latest_topic_file, "r", encoding="utf-8") as f:
              topic_data = json.load(f)

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise Exception("GEMINI_API_KEY is missing.")

          client = genai.Client(api_key=api_key)

          topics_text = json.dumps(
              topic_data,
              ensure_ascii=False
          )

          prompt = f"""
          You are the research and fact-checking agent for a global
          science and interesting-facts Instagram automation system.

          Research every topic below using Google Search.

          IMPORTANT:
          - Verify the actual scientific claim.
          - Do not blindly trust the original hook.
          - Correct exaggerated or misleading claims.
          - Prefer NASA, NOAA, ESA, universities, scientific institutions,
            peer-reviewed research and other highly reliable sources.
          - Do not invent facts.
          - Do not invent URLs.
          - Separate established facts from speculation.
          - Only mark a topic publishable when its main claim is supported.
          - Do not copy source wording.
          - Keep the final information suitable for a general audience.

          For every topic produce:
          topic
          verified_topic
          key_facts
          source_urls
          source_titles
          fact_confidence
          corrected_hook
          publishable
          notes

          fact_confidence must be an integer from 0 to 100.

          Topics:

          {topics_text}
          """

          print("Starting Google-grounded Gemini research...")

          schema = {
              "type": "object",
              "properties": {
                  "research": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "topic": {
                                  "type": "string"
                              },
                              "verified_topic": {
                                  "type": "string"
                              },
                              "key_facts": {
                                  "type": "array",
                                  "items": {
                                      "type": "string"
                                  }
                              },
                              "source_urls": {
                                  "type": "array",
                                  "items": {
                                      "type": "string"
                                  }
                              },
                              "source_titles": {
                                  "type": "array",
                                  "items": {
                                      "type": "string"
                                  }
                              },
                              "fact_confidence": {
                                  "type": "integer"
                              },
                              "corrected_hook": {
                                  "type": "string"
                              },
                              "publishable": {
                                  "type": "boolean"
                              },
                              "notes": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "topic",
                              "verified_topic",
                              "key_facts",
                              "source_urls",
                              "source_titles",
                              "fact_confidence",
                              "corrected_hook",
                              "publishable",
                              "notes"
                          ]
                      }
                  }
              },
              "required": [
                  "research"
              ]
          }

          interaction = client.interactions.create(
              model="gemini-3.8-flash",
              input=prompt,
              tools=[
                  {
                      "type": "google_search"
                  }
              ],
              response_format={
                  "type": "text",
                  "mime_type": "application/json",
                  "schema": schema
              }
          )

          if interaction.status != "completed":
              raise Exception(
                  f"Gemini interaction did not complete: {interaction.status}"
              )

          result_text = interaction.output_text.strip()

          print("Gemini research completed.")

          research_data = json.loads(result_text)

          # Add metadata
          now = datetime.now(timezone.utc)

          research_data["generated_at"] = now.isoformat()
          research_data["source_topic_file"] = latest_topic_file

          today = now.strftime("%Y-%m-%d")

          output_file = f"data/research-{today}.json"

          with open(output_file, "w", encoding="utf-8") as f:
              json.dump(
                  research_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Saved:", output_file)
          print(
              "Topics researched:",
              len(research_data["research"])
          )

          # Print citations found by Google Search grounding
          citation_count = 0

          for step in interaction.steps:
              if step.type == "model_output":
                  for content_block in step.content:
                      if (
                          getattr(content_block, "type", None) == "text"
                          and getattr(content_block, "annotations", None)
                      ):
                          for annotation in content_block.annotations:
                              if getattr(annotation, "type", None) == "url_citation":
                                  citation_count += 1
                                  print(
                                      "Citation:",
                                      getattr(annotation, "title", ""),
                                      getattr(annotation, "url", "")
                                  )

          print("Grounded citations found:", citation_count)

          PY

      - name: Commit research results
        run: |
          git config user.name "instagram-cloud-ai"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new research file."
          else
            git commit -m "AI: research and fact-check topics"
            git push
          fi
