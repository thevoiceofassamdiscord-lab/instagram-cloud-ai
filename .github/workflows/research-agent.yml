name: AI Research and Fact Check Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: pip install -q google-genai

      - name: Research and fact-check topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import glob
          from datetime import datetime, timezone
          from google import genai

          # --------------------------------------------------
          # Find the newest topic file
          # --------------------------------------------------

          topic_files = sorted(glob.glob("data/topics-*.json"))

          if not topic_files:
              raise Exception("No topic files found in data/")

          latest_topic_file = topic_files[-1]

          print("Using topic file:", latest_topic_file)

          with open(latest_topic_file, "r", encoding="utf-8") as f:
              topic_data = json.load(f)

          # --------------------------------------------------
          # Prepare Gemini
          # --------------------------------------------------

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise Exception("GEMINI_API_KEY is missing.")

          client = genai.Client(api_key=api_key)

          topics_text = json.dumps(
              topic_data,
              ensure_ascii=False,
              indent=2
          )

          # --------------------------------------------------
          # Research prompt
          # --------------------------------------------------

          prompt = f"""
          You are the Research and Fact-Checking Agent for an automated
          global Instagram science and interesting-facts content system.

          Below is a list of topics generated by another AI agent.

          YOUR JOB:

          1. Research every topic using Google Search.
          2. Verify the important factual claims.
          3. Separate established facts from speculation, myths,
             exaggeration, or uncertain claims.
          4. Prefer reliable sources such as:
             - NASA
             - NOAA
             - ESA
             - universities
             - scientific institutions
             - peer-reviewed research
             - reputable science organizations
             - highly reliable news organizations when appropriate
          5. Do NOT simply trust the original AI-generated hook.
          6. If a hook is exaggerated, create a scientifically accurate
             replacement hook.
          7. Do not copy sentences from sources.
          8. Do not invent facts or sources.
          9. A topic should only be marked publishable if its main claim
             can be supported by reliable evidence.
          10. Avoid dangerous instructions, unsafe challenges,
              misinformation, or sensational claims that could mislead
              viewers.

          For every topic return:

          - topic
          - verified_topic
          - key_facts
          - source_urls
          - source_titles
          - fact_confidence
          - corrected_hook
          - publishable
          - notes

          fact_confidence must be a number from 0 to 100.

          source_urls must contain real URLs of the sources used.

          Return ONLY valid JSON.
          Do not use Markdown.
          Do not put the JSON inside ``` blocks.

          Required JSON format:

          {{
            "research": [
              {{
                "topic": "topic name",
                "verified_topic": "accurate description",
                "key_facts": [
                  "fact 1",
                  "fact 2",
                  "fact 3"
                ],
                "source_urls": [
                  "https://example.com/source"
                ],
                "source_titles": [
                  "Source title"
                ],
                "fact_confidence": 95,
                "corrected_hook": "Accurate but interesting hook",
                "publishable": true,
                "notes": "Important clarification if needed"
              }}
            ]
          }}

          TOPICS TO RESEARCH:

          {topics_text}
          """

          print("Starting Gemini research...")

          interaction = client.interactions.create(
              model="gemini-3.8-flash",
              input=prompt,
              tools=[
                  {
                      "type": "google_search"
                  }
              ]
          )

          result_text = interaction.output_text.strip()

          # --------------------------------------------------
          # Clean possible Markdown fences
          # --------------------------------------------------

          if result_text.startswith("```"):
              lines = result_text.splitlines()

              if lines and lines[0].startswith("```"):
                  lines = lines[1:]

              if lines and lines[-1].strip() == "```":
                  lines = lines[:-1]

              result_text = "\n".join(lines).strip()

          # --------------------------------------------------
          # Validate JSON
          # --------------------------------------------------

          try:
              research_data = json.loads(result_text)
          except json.JSONDecodeError as e:
              print("Gemini returned invalid JSON:")
              print(result_text)
              raise Exception(f"Could not parse Gemini JSON: {e}")

          if "research" not in research_data:
              raise Exception("Research JSON does not contain 'research'.")

          # --------------------------------------------------
          # Add metadata
          # --------------------------------------------------

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          research_data["generated_at"] = datetime.now(
              timezone.utc
          ).isoformat()

          research_data["source_topic_file"] = latest_topic_file

          output_file = f"data/research-{today}.json"

          with open(output_file, "w", encoding="utf-8") as f:
              json.dump(
                  research_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Research completed successfully.")
          print("Saved:", output_file)
          print("Topics researched:", len(research_data["research"]))

          PY

      - name: Commit research results
        run: |
          git config user.name "instagram-cloud-ai"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new research file to commit."
          else
            git commit -m "AI: research and fact-check topics"
            git push
          fi
